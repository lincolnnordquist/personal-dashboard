# Every service restarts automatically, including after a reboot (Docker starts at boot).
# `docker compose stop` or `down` turns the dashboard off until the next `up`.
#
# Only the frontend publishes a port. nginx in the frontend container forwards /graphql and
# /playground to the backend, and the backend reaches Postgres over the Compose network.
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dashboard:dashboard@postgres:5432/dashboard
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      DEFAULT_LAT: ${DEFAULT_LAT:-}
      DEFAULT_LON: ${DEFAULT_LON:-}
      DEFAULT_LOCATION_NAME: ${DEFAULT_LOCATION_NAME:-}
      # Music playlists live in the repo (music/playlists/*.txt) so they sync through git.
      PLAYLIST_DIR: /data/music/playlists
      # Background themes: one folder of videos per theme. nginx serves the same folder.
      BACKGROUNDS_DIR: /data/backgrounds
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./music:/data/music
      - ./backgrounds:/data/backgrounds:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-7070}:80"
    volumes:
      # Served at /backgrounds, so adding a theme folder needs no rebuild.
      - ./backgrounds:/usr/share/nginx/html/backgrounds:ro
    depends_on:
      - backend

volumes:
  pgdata:
