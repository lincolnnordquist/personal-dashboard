server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's internal DNS. Looking the backend up per request (via the variable below)
    # keeps the proxy working after the backend container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    location /graphql {
        proxy_pass $backend;
    }

    location /playground {
        proxy_pass $backend;
    }

    # Quick-link favicons, fetched and cached by the backend.
    location = /icons {
        proxy_pass $backend;
    }

    location / {
        try_files $uri /index.html;
    }

    # Background theme videos (mounted from the repo's backgrounds/ folder) rarely change;
    # let the browser cache them.
    location /backgrounds/ {
        expires 7d;
        add_header Cache-Control "public";

        # Theme fonts. nginx's built-in types cover woff/woff2 but not otf/ttf, and browsers
        # can reject fonts served with a generic type.
        location ~* \.otf$ {
            types { }
            default_type font/otf;
        }
        location ~* \.ttf$ {
            types { }
            default_type font/ttf;
        }
    }
}
