server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's internal DNS. Looking the backend up per request (via the variable below)
    # keeps the proxy working after the backend container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    location /graphql {
        proxy_pass $backend;
    }

    location /playground {
        proxy_pass $backend;
    }

    location / {
        try_files $uri /index.html;
    }

    # Background videos and posters rarely change; let the browser cache them.
    location /zelda-backgrounds/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
